id: k8s.config_missing
version: 0.1.0
name: K8s Config Missing
domain: k8s
description: Detect, diagnose, and propose guarded recovery for missing Kubernetes ConfigMap, Secret, or config key references.
stages: [detect, diagnose, heal, verify]
risk: medium
permissions: [k8s.read, k8s.write.restart]
tool_dependencies: [kubectl]
tags: [kubernetes, configmap, secret, configuration]
policy:
  requires_approval: true
  safe_auto_execute: false
confidence:
  min_evidence_sources: 2
  min_confidence_for_heal: 0.8
  min_confidence_for_auto_heal: 0.95
