id: k8s.dns_resolution
version: 0.1.0
name: K8s DNS Resolution
domain: k8s
description: Diagnose CoreDNS/kube-dns resolution failures and propose guarded recovery.
stages: [detect, diagnose, heal, verify]
risk: medium
permissions: [k8s.read, k8s.write.rollout]
tool_dependencies: [kubectl]
tags: [kubernetes, dns, coredns, kube-dns]
policy:
  requires_approval: true
  safe_auto_execute: false
confidence:
  min_evidence_sources: 2
  min_confidence_for_heal: 0.82
  min_confidence_for_auto_heal: 0.9
