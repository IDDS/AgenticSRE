id: k8s.pod_crashloop
version: 0.1.0
name: K8s Pod CrashLoop
domain: k8s
description: Detect, diagnose, and propose guarded healing for CrashLoopBackOff pods.
stages: [detect, diagnose, heal, verify]
risk: medium
