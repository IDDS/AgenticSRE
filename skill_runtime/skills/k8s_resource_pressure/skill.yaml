id: k8s.resource_pressure
version: 0.1.0
name: K8s Resource Pressure
domain: k8s
description: Detect, diagnose, and propose guarded recovery for Kubernetes CPU, memory, and disk pressure incidents.
stages: [detect, diagnose, heal, verify]
risk: high
permissions: [k8s.read, k8s.write.restart, k8s.write.node]
tool_dependencies: [kubectl]
tags: [kubernetes, cpu, memory, disk, pressure, capacity]
policy:
  requires_approval: true
  safe_auto_execute: false
confidence:
  min_evidence_sources: 2
  min_confidence_for_heal: 0.8
  min_confidence_for_auto_heal: 0.95
