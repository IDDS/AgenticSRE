id: k8s.scheduling_failed
version: 0.1.0
name: K8s Scheduling Failed
domain: k8s
description: Detect, diagnose, and propose read-only remediation guidance for Kubernetes scheduling failures caused by resource, taint, or quota constraints.
stages: [detect, diagnose, verify]
risk: low
permissions: [k8s.read]
