scenarios:
- id: sn-cpu-stress
  name: Social-Network CPU Stress
  category: resource
  fault_type: cpu_pressure
  description: '[ALERT] High CPU usage detected on node in test-social-network namespace. Post composition API response time increased from 50ms to 2000ms+. Multiple container CPU throttling events observed.'
  target_service: compose-post-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network run cpu-stress --image=alpine:3.18 --image-pull-policy=IfNotPresent --restart=Never -- /bin/sh -c 'trap "kill 0" TERM INT; for i in 1 2 3 4; do while true; do :; done & done; sleep 180 & wait'
    cleanup:
    - kubectl -n test-social-network delete pod cpu-stress --ignore-not-found=true
  expected:
    root_cause_contains:
    - cpu
    - stress
    - resource
    - compose-post
    fault_type: resource_exhaustion
  validation:
    max_detection_time_s: 180
    min_confidence: 0.5
- id: sn-mem-pressure
  name: Social-Network Memory Pressure
  category: resource
  fault_type: memory_pressure
  description: '[ALERT] Pod in test-social-network namespace terminated unexpectedly. Container exit code 137 (SIGKILL). Node memory utilization above 90%. Timeline service intermittently unreachable.'
  target_service: user-timeline-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network run mem-stress --image=alpine:3.18 --image-pull-policy=IfNotPresent --restart=Never --overrides='{"apiVersion":"v1","spec":{"volumes":[{"name":"mem","emptyDir":{"medium":"Memory","sizeLimit":"128Mi"}}],"containers":[{"name":"mem-stress","image":"alpine:3.18","imagePullPolicy":"IfNotPresent","volumeMounts":[{"name":"mem","mountPath":"/mem"}],"command":["/bin/sh","-c","trap \"rm -f /mem/fill; exit\" TERM INT; dd if=/dev/zero of=/mem/fill bs=1M count=96; sleep 180"]}]}}'
    cleanup:
    - kubectl -n test-social-network delete pod mem-stress --ignore-not-found=true
  expected:
    root_cause_contains:
    - memory
    - oom
    - pressure
    - limit
    fault_type: resource_exhaustion
  validation:
    max_detection_time_s: 120
    min_confidence: 0.5
- id: sn-crashloop
  name: Social-Network CrashLoop
  category: application
  fault_type: crash_loop
  description: '[ALERT] Pod restart count rapidly increasing in test-social-network namespace. Container exiting immediately after start. Back-off restarting pattern detected.'
  target_service: crash-test
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network run crash-test --image=alpine:3.18 --image-pull-policy=IfNotPresent --restart=Always -- /bin/sh -c 'exit 1'
    cleanup:
    - kubectl -n test-social-network delete pod crash-test --ignore-not-found=true
  expected:
    root_cause_contains:
    - crash
    - restart
    - backoff
    - exit
    fault_type: application_crash
  validation:
    max_detection_time_s: 180
    min_confidence: 0.5
- id: sn-network-delay
  name: Social-Network Entry Replica Exhaustion
  category: network
  fault_type: dependency_timeout
  description: '[ALERT] Social network frontend (nginx-thrift) requests are timing out because its backing replicas were drained through the Kubernetes control plane. The symptom propagates through the business request path without relying on tools inside the container.'
  target_service: nginx-thrift
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - sh -c 'replicas=$(kubectl -n test-social-network get deploy/nginx-thrift -o jsonpath="{.spec.replicas}"); kubectl -n test-social-network annotate deploy/nginx-thrift agenticsre.io/original-replicas="${replicas:-1}" --overwrite'
    - kubectl -n test-social-network scale deploy/nginx-thrift --replicas=0
    cleanup:
    - sh -c 'replicas=$(kubectl -n test-social-network get deploy/nginx-thrift -o jsonpath="{.metadata.annotations.agenticsre\.io/original-replicas}"); kubectl -n test-social-network scale deploy/nginx-thrift --replicas="${replicas:-1}"; kubectl -n test-social-network annotate deploy/nginx-thrift agenticsre.io/original-replicas-'
  expected:
    root_cause_contains:
    - timeout
    - service
    - endpoints
    - nginx
    fault_type: network_issue
  validation:
    max_detection_time_s: 120
    min_confidence: 0.5
- id: sn-svc-scale-down
  name: Social-Network Service Scale Down
  category: availability
  fault_type: service_unavailable
  description: '[ALERT] Home timeline read API returning 503 Service Unavailable. No ready endpoints found for home-timeline-service. Users unable to load their home timeline feed. Other services appear healthy.'
  target_service: home-timeline-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network scale deploy/home-timeline-service --replicas=0
    cleanup:
    - kubectl -n test-social-network scale deploy/home-timeline-service --replicas=1
  expected:
    root_cause_contains:
    - replica
    - scale
    - unavailable
    - endpoint
    - home-timeline
    fault_type: service_disruption
  validation:
    max_detection_time_s: 120
    min_confidence: 0.5
- id: sn-db-slow
  name: Post Storage Write Latency Spike
  category: cascade
  fault_type: database_degradation
  description: '[ALERT] Post composition requests failing with timeout errors. post-storage-service P99 latency exceeded 10s (normal: 50ms). Compose-post-service reporting upstream connection timeouts. New posts are not being saved.'
  target_service: post-storage-mongodb
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network scale deploy/post-storage-mongodb --replicas=0
    cleanup:
    - kubectl -n test-social-network scale deploy/post-storage-mongodb --replicas=1
  expected:
    root_cause_contains:
    - mongodb
    - post-storage
    - database
    - slow
    - latency
    - timeout
    - write
    - io
    fault_type: dependency_failure
  validation:
    max_detection_time_s: 180
    min_confidence: 0.4
- id: sn-redis-down
  name: Home Timeline Performance Degradation
  category: cascade
  fault_type: cache_failure
  description: '[ALERT] Home timeline read latency increased 50x (from 20ms to 1000ms+). home-timeline-service reporting connection refused errors to an upstream dependency. Jaeger traces show abnormal span durations on home-timeline read path. No pod crashes detected.'
  target_service: home-timeline-redis
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network scale deploy/home-timeline-redis --replicas=0
    cleanup:
    - kubectl -n test-social-network scale deploy/home-timeline-redis --replicas=1
  expected:
    root_cause_contains:
    - redis
    - cache
    - home-timeline
    - unavailable
    - connection
    fault_type: dependency_failure
  validation:
    max_detection_time_s: 120
    min_confidence: 0.5
- id: sn-compose-cpu
  name: Post Composition Timeout
  category: cascade
  fault_type: service_cpu_saturation
  description: '[ALERT] Post composition API returning 504 Gateway Timeout. compose-post-service CPU utilization at 100%. Write path completely blocked — no new posts being created. Read operations unaffected. Frontend error rate spiked to 40%.'
  target_service: compose-post-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'rm -f /tmp/agenticsre-cpu-burn.pids; for i in $(seq 1 4); do (while true; do :; done) </dev/null >/dev/null 2>&1 & echo $! >> /tmp/agenticsre-cpu-burn.pids; done'
    cleanup:
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'if [ -f /tmp/agenticsre-cpu-burn.pids ]; then xargs -r kill < /tmp/agenticsre-cpu-burn.pids 2>/dev/null; rm -f /tmp/agenticsre-cpu-burn.pids; fi' || true
  expected:
    root_cause_contains:
    - compose-post
    - cpu
    - timeout
    - latency
    - write
    - saturation
    fault_type: resource_exhaustion
  validation:
    max_detection_time_s: 120
    min_confidence: 0.5
- id: sn-memcached-down
  name: User Authentication Slowdown
  category: cascade
  fault_type: cache_failure
  description: '[ALERT] All API endpoints showing increased latency (+300ms baseline). user-service response time degraded from 5ms to 200ms+. Login and profile operations abnormally slow. Traces show user-service as bottleneck across all request paths.'
  target_service: user-memcached
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network scale deploy/user-memcached --replicas=0
    cleanup:
    - kubectl -n test-social-network scale deploy/user-memcached --replicas=1
  expected:
    root_cause_contains:
    - memcached
    - user
    - cache
    - unavailable
    - auth
    - connection
    fault_type: dependency_failure
  validation:
    max_detection_time_s: 120
    min_confidence: 0.4
- id: sn-multi-fault
  name: Multiple Service Degradation
  category: cascade
  fault_type: compound_failure
  description: '[ALERT] Two independent anomalies detected simultaneously: (1) Social graph follower/following queries returning connection errors. (2) Text processing in post composition showing extreme latency. The two failure patterns appear unrelated but co-occurring. Overall system health score dropped to 60%.'
  target_service: multiple
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network scale deploy/social-graph-redis --replicas=0
    - kubectl -n test-social-network exec deploy/text-service -- sh -c 'rm -f /tmp/agenticsre-cpu-burn.pids; for i in $(seq 1 4); do (while true; do :; done) </dev/null >/dev/null 2>&1 & echo $! >> /tmp/agenticsre-cpu-burn.pids; done'
    cleanup:
    - kubectl -n test-social-network scale deploy/social-graph-redis --replicas=1
    - kubectl -n test-social-network exec deploy/text-service -- sh -c 'if [ -f /tmp/agenticsre-cpu-burn.pids ]; then xargs -r kill < /tmp/agenticsre-cpu-burn.pids 2>/dev/null; rm -f /tmp/agenticsre-cpu-burn.pids; fi' || true
  expected:
    root_cause_contains:
    - social-graph
    - redis
    - text-service
    - cpu
    - multiple
    - compound
    fault_type: compound_failure
  validation:
    max_detection_time_s: 240
    min_confidence: 0.3
- id: sn-network-partition
  name: Partial Post Failure
  category: cascade
  fault_type: network_partition
  description: '[ALERT] Intermittent post composition failures — posts containing URLs fail with timeout, posts without URLs succeed normally. url-shorten-service health check failing. Partial outage pattern: ~30% of compose-post requests affected.'
  target_service: url-shorten-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network scale deploy/url-shorten-service --replicas=0
    cleanup:
    - kubectl -n test-social-network scale deploy/url-shorten-service --replicas=1
  expected:
    root_cause_contains:
    - url-shorten
    - network
    - connection
    - timeout
    - refused
    - partition
    fault_type: network_issue
  validation:
    max_detection_time_s: 180
    min_confidence: 0.4
- id: sn-staged-write-cascade
  name: Staged Write Path Cascade
  category: complex
  fault_type: staged_compound_failure
  complexity: high
  description: '[ALERT] Post creation latency increases in two waves. First, post-storage write latency rises above 5s; about one minute later compose-post-service CPU climbs sharply and 504 errors appear at the frontend. Read APIs remain mostly healthy. The incident timeline suggests a staged cascade rather than a single-point outage.'
  target_service: compose-post-service,post-storage-mongodb
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network scale deploy/post-storage-mongodb --replicas=0
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'rm -f /tmp/agenticsre-cpu-burn.pids /tmp/agenticsre-delayed-fault.pid; (sleep 45; test -f /tmp/agenticsre-delayed-fault.pid || exit 0; for i in $(seq 1 2); do (while true; do :; done) </dev/null >/dev/null 2>&1 & echo $! >> /tmp/agenticsre-cpu-burn.pids; done) </dev/null >/dev/null 2>&1 & echo $! > /tmp/agenticsre-delayed-fault.pid'
    cleanup:
    - kubectl -n test-social-network scale deploy/post-storage-mongodb --replicas=1
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'if [ -f /tmp/agenticsre-delayed-fault.pid ]; then kill $(cat /tmp/agenticsre-delayed-fault.pid) 2>/dev/null || true; rm -f /tmp/agenticsre-delayed-fault.pid; fi; if [ -f /tmp/agenticsre-cpu-burn.pids ]; then xargs -r kill < /tmp/agenticsre-cpu-burn.pids 2>/dev/null; rm -f /tmp/agenticsre-cpu-burn.pids; fi' || true
  expected:
    root_cause_contains:
    - post-storage
    - mongodb
    - compose-post
    - cpu
    - cascade
    - write
    - latency
    fault_type: compound_failure
  validation:
    max_detection_time_s: 240
    min_confidence: 0.35
- id: sn-gray-url-brownout
  name: Gray Failure on URL Post Path
  category: complex
  fault_type: gray_failure
  complexity: high
  description: '[ALERT] Only posts containing URLs are slow or timing out. Normal text-only post composition and read APIs remain mostly healthy. url-shorten-service CPU usage is elevated and its downstream calls show intermittent timeout. Overall error rate is moderate, but one user workflow is severely degraded.'
  target_service: url-shorten-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network exec deploy/url-shorten-service -- sh -c 'rm -f /tmp/agenticsre-cpu-burn.pids; for i in $(seq 1 3); do (while true; do :; done) </dev/null >/dev/null 2>&1 & echo $! >> /tmp/agenticsre-cpu-burn.pids; done'
    cleanup:
    - kubectl -n test-social-network exec deploy/url-shorten-service -- sh -c 'if [ -f /tmp/agenticsre-cpu-burn.pids ]; then xargs -r kill < /tmp/agenticsre-cpu-burn.pids 2>/dev/null; rm -f /tmp/agenticsre-cpu-burn.pids; fi' || true
  expected:
    root_cause_contains:
    - url-shorten
    - url
    - cpu
    - partial
    - gray
    - timeout
    fault_type: resource_exhaustion
  validation:
    max_detection_time_s: 180
    min_confidence: 0.4
- id: sn-observability-blindspot
  name: RCA Under Observability Blind Spot
  category: complex
  fault_type: observability_blindspot
  complexity: high
  description: '[ALERT] Post composition write latency and 504 errors are increasing, but several Kubernetes object metrics disappear from dashboards at the same time. Metrics coverage is incomplete while user-facing errors continue. The RCA system must distinguish the business fault from the monitoring blind spot.'
  target_service: compose-post-service,kube-state-metrics
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n agenticsre-faultlab-observe scale deploy/kube-prom-kube-state-metrics --replicas=0
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'rm -f /tmp/agenticsre-cpu-burn.pids; for i in $(seq 1 3); do (while true; do :; done) </dev/null >/dev/null 2>&1 & echo $! >> /tmp/agenticsre-cpu-burn.pids; done'
    cleanup:
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'if [ -f /tmp/agenticsre-cpu-burn.pids ]; then xargs -r kill < /tmp/agenticsre-cpu-burn.pids 2>/dev/null; rm -f /tmp/agenticsre-cpu-burn.pids; fi' || true
    - kubectl -n agenticsre-faultlab-observe scale deploy/kube-prom-kube-state-metrics --replicas=1
  expected:
    root_cause_contains:
    - compose-post
    - cpu
    - metrics
    - observability
    - blind
    - kube-state-metrics
    fault_type: compound_failure
  validation:
    max_detection_time_s: 240
    min_confidence: 0.3
- id: sn-stale-signal-distractor
  name: Distractor Signal During CPU Saturation
  category: complex
  fault_type: distractor_signal
  complexity: medium
  description: '[ALERT] compose-post-service write path is timing out and CPU is saturated. At the same time, an unrelated debug pod is crash-looping in the same namespace. The user-facing symptom is tied to post composition, but Kubernetes events contain a noisy crash signal that may distract RCA.'
  target_service: compose-post-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network run rca-distractor-crash --image=alpine:3.18 --image-pull-policy=IfNotPresent --restart=Always -- /bin/sh -c 'exit 1'
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'rm -f /tmp/agenticsre-cpu-burn.pids; for i in $(seq 1 4); do (while true; do :; done) </dev/null >/dev/null 2>&1 & echo $! >> /tmp/agenticsre-cpu-burn.pids; done'
    cleanup:
    - kubectl -n test-social-network delete pod rca-distractor-crash --ignore-not-found=true
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'if [ -f /tmp/agenticsre-cpu-burn.pids ]; then xargs -r kill < /tmp/agenticsre-cpu-burn.pids 2>/dev/null; rm -f /tmp/agenticsre-cpu-burn.pids; fi' || true
  expected:
    root_cause_contains:
    - compose-post
    - cpu
    - saturation
    - distractor
    - crash
    - not root cause
    fault_type: resource_exhaustion
  validation:
    max_detection_time_s: 180
    min_confidence: 0.4
- id: sn-transient-cache-flap
  name: Transient Cache Flap with Lagging Symptoms
  category: complex
  fault_type: transient_dependency_failure
  complexity: high
  description: '[ALERT] Home timeline latency spikes for several minutes and then partially recovers. Error logs show short bursts of upstream connection failures, but current pod health looks normal. The root cause is transient and the symptom lags behind the dependency recovery.'
  target_service: home-timeline-redis
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - sh -c 'pid_file=/tmp/agenticsre-transient-cache-flap.pid; rm -f "$pid_file"; (kubectl -n test-social-network scale deploy/home-timeline-redis --replicas=0; sleep 75; test -f "$pid_file" && kubectl -n test-social-network scale deploy/home-timeline-redis --replicas=1) </dev/null >/tmp/agenticsre-transient-cache-flap.log 2>&1 & echo $! > "$pid_file"'
    cleanup:
    - sh -c 'pid_file=/tmp/agenticsre-transient-cache-flap.pid; if [ -f "$pid_file" ]; then kill $(cat "$pid_file") 2>/dev/null || true; rm -f "$pid_file"; fi; kubectl -n test-social-network scale deploy/home-timeline-redis --replicas=1'
  expected:
    root_cause_contains:
    - redis
    - home-timeline
    - transient
    - cache
    - connection
    - recover
    fault_type: dependency_failure
  validation:
    max_detection_time_s: 240
    min_confidence: 0.35
- id: sn-scaleout-capacity-failure
  name: Scale-Out Capacity Failure
  category: complex
  fault_type: scheduling_capacity_failure
  complexity: high
  description: '[ALERT] Post composition traffic increases and HPA-like scale-out is attempted, but additional compose-post pods remain Pending or fail scheduling due to unrealistic resource requests. Existing compose-post instances become overloaded and frontend 504 errors increase.'
  target_service: compose-post-service
  inject:
    method: kubectl
    namespace: test-social-network
    commands:
    - kubectl -n test-social-network run compose-post-overrequest --image=alpine:3.18 --image-pull-policy=IfNotPresent --restart=Never --overrides='{"apiVersion":"v1","spec":{"containers":[{"name":"compose-post-overrequest","image":"alpine:3.18","imagePullPolicy":"IfNotPresent","command":["/bin/sh","-c","sleep 180"],"resources":{"requests":{"cpu":"100","memory":"1Ti"},"limits":{"cpu":"100","memory":"1Ti"}}}]}}'
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'rm -f /tmp/agenticsre-cpu-burn.pids; for i in $(seq 1 2); do (while true; do :; done) </dev/null >/dev/null 2>&1 & echo $! >> /tmp/agenticsre-cpu-burn.pids; done'
    cleanup:
    - kubectl -n test-social-network delete pod compose-post-overrequest --ignore-not-found=true
    - kubectl -n test-social-network exec deploy/compose-post-service -- sh -c 'if [ -f /tmp/agenticsre-cpu-burn.pids ]; then xargs -r kill < /tmp/agenticsre-cpu-burn.pids 2>/dev/null; rm -f /tmp/agenticsre-cpu-burn.pids; fi' || true
  expected:
    root_cause_contains:
    - pending
    - insufficient
    - resource
    - scheduling
    - compose-post
    - capacity
    fault_type: resource_exhaustion
  validation:
    max_detection_time_s: 240
    min_confidence: 0.35
workload:
  target_url: http://localhost:8080
  endpoints:
  - path: /wrk2-api/post/compose
    method: POST
    rate: 10
  - path: /wrk2-api/home-timeline/read
    method: GET
    rate: 20
  - path: /wrk2-api/user-timeline/read
    method: GET
    rate: 15
  duration_per_scenario: 30
scoring:
  detection_time_weight: 0.1
  confidence_weight: 0.25
  root_cause_match_weight: 0.4
  remediation_quality_weight: 0.25
