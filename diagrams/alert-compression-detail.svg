<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2928" viewBox="0 0 1440 2928" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" xml:lang="zh-CN"><title>AgenticSRE 告警压缩技术详图</title><g transform="translate(0 0)"><rect x="0" y="0" width="1440" height="968" rx="0" fill="#F7FAF9" stroke="none" stroke-width="2"/><text x="52" y="57" font-size="26" font-weight="700" fill="#096D68">AgenticSRE   /   告警压缩架构</text><text x="1310" y="55" font-size="22" font-weight="400" fill="#46616C">1 / 3</text><text x="52" y="128" font-size="54" font-weight="700" fill="#122E3C">原始告警怎样归入同一组</text><text x="53" y="179" font-size="26" font-weight="400" fill="#46616C">先按对象身份、状态和消息签名分桶，再按每组首条告警的时间切窗。</text><rect x="52" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="72" y="260" font-size="26" font-weight="600" fill="white">实时采集 / 批量导入</text><text x="362" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="394" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="414" y="260" font-size="26" font-weight="600" fill="white">规范化原始记录</text><text x="704" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="736" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="756" y="260" font-size="26" font-weight="600" fill="white">分桶并切分时间窗</text><text x="1046" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="1078" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="1098" y="260" font-size="26" font-weight="600" fill="white">生成告警组</text><rect x="52" y="321" width="652" height="321" rx="12" fill="white" stroke="#C7D9DB" stroke-width="2"/><text x="76" y="370" font-size="31" font-weight="700" fill="#096D68">归组键</text><text x="76" y="423" font-size="25" font-weight="400" fill="#122E3C">范围：集群、命名空间、对象类型和名称</text><text x="76" y="471" font-size="25" font-weight="400" fill="#122E3C">实例：目标 UID；已知与未知分别保留</text><text x="76" y="519" font-size="25" font-weight="400" fill="#122E3C">告警：名称、来源、状态、观测维度</text><text x="76" y="567" font-size="25" font-weight="400" fill="#122E3C">消息：安全模板签名；Drain3 补充模板注释</text><text x="76" y="615" font-size="25" font-weight="400" fill="#122E3C">身份冲突或缺时间戳时，按记录单独保留</text><rect x="736" y="321" width="652" height="321" rx="12" fill="white" stroke="#C7D9DB" stroke-width="2"/><text x="760" y="370" font-size="31" font-weight="700" fill="#096D68">窗口与组内摘要</text><text x="760" y="423" font-size="25" font-weight="400" fill="#122E3C">默认窗口 300 秒，可配置为 1–3600 秒</text><text x="760" y="471" font-size="25" font-weight="400" fill="#122E3C">当前时间距组内首条超过窗口，另起一组</text><text x="760" y="519" font-size="25" font-weight="400" fill="#122E3C">保留代表告警、全部成员索引与原文</text><text x="760" y="567" font-size="25" font-weight="400" fill="#122E3C">记录最高严重级别、首次和末次出现时间</text><text x="760" y="615" font-size="25" font-weight="400" fill="#122E3C">数值摘要保留极值及其来源告警 ID</text><rect x="52" y="688" width="1336" height="207" rx="12" fill="#FAF1DF" stroke="none" stroke-width="2"/><text x="80" y="739" font-size="31" font-weight="700" fill="#805214">示例  /  同名 Pod 在窗口内重建</text><text x="80" y="790" font-size="25" font-weight="400" fill="#122E3C">假设其他归组字段相同：10:00 与 10:02 都指向 UID-A，归入同一组。</text><text x="80" y="835" font-size="25" font-weight="400" fill="#122E3C">10:03 的同名 Pod 已变为 UID-B，另起一组。三条原始告警都可回查。</text><path d="M52 919 L1388 919" fill="none" stroke="#C7D9DB" stroke-width="2"/><text x="53" y="950" font-size="19" font-weight="400" fill="#46616C">实现依据   agents/alert_compression.py   ·   agents/alert_semantics.py   ·   agents/alert_numeric.py</text></g><g transform="translate(0 980)"><rect x="0" y="0" width="1440" height="968" rx="0" fill="#F7FAF9" stroke="none" stroke-width="2"/><text x="52" y="57" font-size="26" font-weight="700" fill="#096D68">AgenticSRE   /   告警压缩架构</text><text x="1310" y="55" font-size="22" font-weight="400" fill="#46616C">2 / 3</text><text x="52" y="128" font-size="54" font-weight="700" fill="#122E3C">两个告警组为什么会连边</text><text x="53" y="179" font-size="26" font-weight="400" fill="#46616C">告警组是 SCAG 的节点。每条关联边保存关系类型、两端告警引用和各项证据检查结果。</text><rect x="52" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="72" y="260" font-size="26" font-weight="600" fill="white">已生成的告警组</text><text x="362" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="394" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="414" y="260" font-size="26" font-weight="600" fill="white">有界候选召回</text><text x="704" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="736" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="756" y="260" font-size="26" font-weight="600" fill="white">可选模型审核</text><text x="1046" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="1078" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="1098" y="260" font-size="26" font-weight="600" fill="white">SCAG 关联检查</text><rect x="52" y="321" width="652" height="321" rx="12" fill="white" stroke="#C7D9DB" stroke-width="2"/><text x="76" y="370" font-size="31" font-weight="700" fill="#096D68">候选与审核</text><text x="76" y="423" font-size="25" font-weight="400" fill="#122E3C">局部邻域结合实体、标签与文本线索召回</text><text x="76" y="471" font-size="25" font-weight="400" fill="#122E3C">向量可用时补充近邻；默认取 Top-5</text><text x="76" y="519" font-size="25" font-weight="400" fill="#122E3C">候选按批审核，引用两端的原始告警</text><text x="76" y="567" font-size="25" font-weight="400" fill="#122E3C">默认审核预算：8 次模型调用、120 秒</text><text x="76" y="615" font-size="25" font-weight="400" fill="#122E3C">分别记录已审、失败和待审的候选对</text><rect x="736" y="321" width="652" height="321" rx="12" fill="white" stroke="#C7D9DB" stroke-width="2"/><text x="760" y="370" font-size="31" font-weight="700" fill="#096D68">关联边的证据条件</text><text x="760" y="423" font-size="25" font-weight="400" fill="#122E3C">结构：核验对象身份及有效期内的拓扑路径</text><text x="760" y="471" font-size="25" font-weight="400" fill="#122E3C">时间：检查窗口；传播关系还要求先后顺序</text><text x="760" y="519" font-size="25" font-weight="400" fill="#122E3C">统计：检查与这对告警组匹配的测量证据</text><text x="760" y="567" font-size="25" font-weight="400" fill="#122E3C">传播或变更触发：另查调用链或变更上下文</text><text x="760" y="615" font-size="25" font-weight="400" fill="#122E3C">保留各项检查结果、关联方向及证据引用</text><rect x="52" y="688" width="1336" height="207" rx="12" fill="#FAF1DF" stroke="none" stroke-width="2"/><text x="80" y="739" font-size="31" font-weight="700" fill="#805214">如何解读一条边</text><text x="80" y="790" font-size="25" font-weight="400" fill="#122E3C">适用检查全部通过 → 有证据支持；范围冲突或任一项失败 → 有反证；其余 → 未核实。</text><text x="80" y="835" font-size="25" font-weight="400" fill="#122E3C">即使关联得到支持，也只作为 RCA 的调查线索；根因判定和告警抑制需要独立依据。</text><path d="M52 919 L1388 919" fill="none" stroke="#C7D9DB" stroke-width="2"/><text x="53" y="950" font-size="19" font-weight="400" fill="#46616C">实现依据   agents/alert_retrieval.py   ·   agents/alert_review.py   ·   agents/alert_semantics.py</text></g><g transform="translate(0 1960)"><rect x="0" y="0" width="1440" height="968" rx="0" fill="#F7FAF9" stroke="none" stroke-width="2"/><text x="52" y="57" font-size="26" font-weight="700" fill="#096D68">AgenticSRE   /   告警压缩架构</text><text x="1310" y="55" font-size="22" font-weight="400" fill="#46616C">3 / 3</text><text x="52" y="128" font-size="54" font-weight="700" fill="#122E3C">如何从诊断结果追到每条原始告警</text><text x="53" y="179" font-size="26" font-weight="400" fill="#46616C">每次发布都校验当前分组；版本同时约束原文回查、人工调整和后续诊断取证。</text><rect x="52" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="72" y="260" font-size="26" font-weight="600" fill="white">分区完整性校验</text><text x="362" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="394" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="414" y="260" font-size="26" font-weight="600" fill="white">原子发布扫描快照</text><text x="704" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="736" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="756" y="260" font-size="26" font-weight="600" fill="white">按组与版本回查</text><text x="1046" y="260" font-size="27" font-weight="700" fill="#096D68">→</text><rect x="1078" y="215" width="303" height="69" rx="12" fill="#193847" stroke="none" stroke-width="2"/><text x="1098" y="260" font-size="26" font-weight="600" fill="white">交付 RCA 证据包</text><rect x="52" y="321" width="652" height="321" rx="12" fill="white" stroke="#C7D9DB" stroke-width="2"/><text x="76" y="370" font-size="31" font-weight="700" fill="#096D68">发布与回查</text><text x="76" y="423" font-size="25" font-weight="400" fill="#122E3C">每条输入恰好归属一组；成员索引有效</text><text x="76" y="471" font-size="25" font-weight="400" fill="#122E3C">代表告警属于该组，最高严重级别未降低</text><text x="76" y="519" font-size="25" font-weight="400" fill="#122E3C">回查键：扫描 ID、分组 ID、revision</text><text x="76" y="567" font-size="25" font-weight="400" fill="#122E3C">分页读取原文；版本不匹配时返回 409</text><text x="76" y="615" font-size="25" font-weight="400" fill="#122E3C">RCA 启动时保存目标、样本、极值与遗漏说明</text><rect x="736" y="321" width="652" height="321" rx="12" fill="white" stroke="#C7D9DB" stroke-width="2"/><text x="760" y="370" font-size="31" font-weight="700" fill="#096D68">人工调整与作业恢复</text><text x="760" y="423" font-size="25" font-weight="400" fill="#122E3C">拆分或合并须提供原因并核对当前版本</text><text x="760" y="471" font-size="25" font-weight="400" fill="#122E3C">同一对象的不同资源实例受合并限制</text><text x="760" y="519" font-size="25" font-weight="400" fill="#122E3C">新分区使旧审核失效，须重新扫描和审核</text><text x="760" y="567" font-size="25" font-weight="400" fill="#122E3C">SQLite 保存批次检查点与已预留预算</text><text x="760" y="615" font-size="25" font-weight="400" fill="#122E3C">恢复时复用快照；旧作业不能覆盖新分区</text><rect x="52" y="688" width="1336" height="207" rx="12" fill="#FAF1DF" stroke="none" stroke-width="2"/><text x="80" y="739" font-size="31" font-weight="700" fill="#805214">示例  /  调查开始后，值班人员重新拆分告警组</text><text x="80" y="790" font-size="25" font-weight="400" fill="#122E3C">调查 A 已保存版本 V1 的证据包。拆分后发布 V2，后续查询使用 V2 获取新的分组与原文。</text><text x="80" y="835" font-size="25" font-weight="400" fill="#122E3C">V1 的审核结果保留作历史记录；调查 A 仍可按启动时的证据解释当时的结论。</text><path d="M52 919 L1388 919" fill="none" stroke="#C7D9DB" stroke-width="2"/><text x="53" y="950" font-size="19" font-weight="400" fill="#46616C">实现依据   agents/alert_integrity.py   ·   agents/alert_jobs.py   ·   agents/alert_compression.py   ·   docs/alert-compression.md</text></g></svg>