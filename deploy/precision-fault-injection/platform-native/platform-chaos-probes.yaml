      imagePullPolicy: IfNotPresent
      command: ["/usr/local/bin/python3", "/opt/agenticsre/server.py"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 96Mi}
      volumeMounts:
        - {name: probe-source, mountPath: /opt/agenticsre, readOnly: true}
  volumes:
    - name: probe-source
      configMap: {name: agenticsre-platform-chaos-probes}
