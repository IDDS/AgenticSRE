apiVersion: v1
kind: Namespace
metadata:
  name: agenticsre-platform-chaos-validation
  labels:
    app.kubernetes.io/managed-by: agenticsre
    agenticsre.local/validation: platform-native-faults
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenticsre-platform-chaos-probes
  namespace: agenticsre-platform-chaos-validation
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            payload = b"agenticsre-ok\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, *_args):
            return

    ThreadingHTTPServer(("0.0.0.0", 18080), Handler).serve_forever()
  io_probe.py: |
    import os
    import sys
    import time

    path = sys.argv[1]
    started = time.monotonic()
    descriptor = os.open(path, os.O_CREAT | os.O_WRONLY | os.O_TRUNC, 0o600)
    os.write(descriptor, b"x" * 4096)
    os.fsync(descriptor)
    os.close(descriptor)
    print(int((time.monotonic() - started) * 1000))
  time_probe.py: |
    import time

    while True:
        print(f"epoch={int(time.time())}", flush=True)
        time.sleep(0.5)
---
apiVersion: v1
kind: Pod
metadata:
  name: agenticsre-network-client
  namespace: agenticsre-platform-chaos-validation
  labels:
    app: agenticsre-network-client
    agenticsre.local/validation: platform-native-faults
spec:
  nodeName: lsy-3
  restartPolicy: Never
  containers:
    - name: probe
      image: 10.10.3.146:5001/online-boutique/recommendationservice@sha256:8c40a3dd88153a08139ec3c3e4c28e53e407a02f8ebf5c27cccdf537fd45fa22
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 96Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: agenticsre-network-target
  namespace: agenticsre-platform-chaos-validation
  labels:
    app: agenticsre-network-target
    agenticsre.local/validation: platform-native-faults
spec:
