apiVersion: v1
kind: Pod
metadata:
  name: agenticsre-bytecode-probe
  namespace: agenticsre-bytecode-validation
  labels:
    app: agenticsre-bytecode-probe
    app.kubernetes.io/managed-by: agenticsre
    agenticsre.local/validation: bytecode-method-precision
spec:
  nodeName: lsy-2
  restartPolicy: Never
  containers:
    - name: probe
      image: docker.io/opspai/ts-auth-service:v1.2.9
      imagePullPolicy: IfNotPresent
      command:
        - java
      args:
        - -Xint
        - -cp
        - /opt/agenticsre
        - AgenticSREBytecodeProbe
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      volumeMounts:
        - name: probe-class
          mountPath: /opt/agenticsre
          readOnly: true
  volumes:
    - name: probe-class
      configMap:
        name: agenticsre-bytecode-probe-class
