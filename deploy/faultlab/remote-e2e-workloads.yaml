apiVersion: v1
kind: Namespace
metadata:
  name: test-social-network
  labels:
    app.kubernetes.io/part-of: agenticsre-faultlab
---
apiVersion: v1
kind: Namespace
metadata:
  name: agenticsre-faultlab-observe
  labels:
    app.kubernetes.io/part-of: agenticsre-faultlab
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agenticsre-faultlab-limits
  namespace: test-social-network
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 256Mi}
      defaultRequest: {cpu: 5m, memory: 8Mi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agenticsre-faultlab-limits
  namespace: agenticsre-faultlab-observe
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 256Mi}
      defaultRequest: {cpu: 5m, memory: 8Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-prom-kube-state-metrics
  namespace: agenticsre-faultlab-observe
  labels: &observe-labels
    app: kube-prom-kube-state-metrics
    app.kubernetes.io/part-of: agenticsre-faultlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-prom-kube-state-metrics
  template:
    metadata:
      labels: *observe-labels
    spec:
      containers:
        - name: probe
          image: alpine:3.18
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c, "while true; do sleep 3600; done"]
          resources: &probe-resources
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 250m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compose-post-service
  namespace: test-social-network
  labels: &compose-labels
    app: compose-post-service
    app.kubernetes.io/part-of: agenticsre-faultlab
spec:
  replicas: 1
  selector:
    matchLabels: {app: compose-post-service}
  template:
    metadata: {labels: *compose-labels}
    spec:
      containers:
        - {name: probe, image: "alpine:3.18", imagePullPolicy: IfNotPresent, command: [/bin/sh, -c, "while true; do sleep 3600; done"]}
---
